name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Copiar Chart.js para o app (funciona offline)
        run: npm run copiar-chart

      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Definir versão do app (número do build)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Usar a chave de assinatura fixa
        # Com a mesma chave em todo build, cada APK novo atualiza o app já instalado
        # sem perder os dados.
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk refugo-tecidos.apk

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: refugo-tecidos-apk
          path: refugo-tecidos.apk
          retention-days: 30

      - name: Publicar o APK em Releases (link fixo para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: APK mais recente
          body: |
            Último APK gerado automaticamente (build ${{ github.run_number }}).
            Baixe o arquivo `refugo-tecidos.apk` abaixo e instale no celular.
          files: refugo-tecidos.apk
          make_latest: true
